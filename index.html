<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Сток Blox Fruits</title>
<meta name="theme-color" content="#0b0e17">
<meta name="description" content="Актуальный сток Blox Fruit Dealer и Миража">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0b0e17; --card:#151a2b; --card2:#1c2338;
    --text:#eef1ff; --muted:#8b93ad; --accent:#7c5cff;
    --green:#35d07f; --gold:#ffc247; --red:#ff5e6c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -10%,#1a2140 0%,var(--bg) 60%);
    color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    min-height:100vh;padding:16px 14px 28px;max-width:560px;margin:0 auto;
  }
  header{text-align:center;padding:8px 0 4px}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:.2px}
  .sub{color:var(--muted);font-size:13px}
  .pill{display:inline-block;margin-top:10px;padding:8px 14px;border-radius:999px;
    background:var(--card);border:1px solid #262e4a;font-size:14px}
  .pill b{color:var(--accent)}
  .warn{color:var(--gold)}
  section{margin-top:18px}
  h2{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  li{
    background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid #232a44;border-radius:14px;padding:12px 14px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .name{font-size:16px;font-weight:600}
  .en{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:2px}
  .price{font-size:15px;font-variant-numeric:tabular-nums;color:var(--text);white-space:nowrap}
  .price small{color:var(--muted);font-size:11px;margin-left:3px}
  li.top{border-color:#4a3a12;box-shadow:0 0 0 1px #4a3a1233 inset}
  li.top .price{color:var(--gold)}
  .empty{color:var(--muted);font-size:14px;padding:10px 2px}
  button{
    width:100%;margin-top:18px;padding:14px;border-radius:14px;border:0;
    background:var(--accent);color:#fff;font-size:15px;font-weight:600;
    cursor:pointer;transition:opacity .15s
  }
  button:active{opacity:.75}
  button[disabled]{opacity:.5}
  footer{margin-top:16px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #ffffff55;border-top-color:#fff;
    border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <h1>🍇 Сток Blox Fruits</h1>
  <div class="sub" id="updated">загрузка…</div>
  <div class="pill" id="timer">⏳ считаю…</div>
</header>

<main>
  <section>
    <h2>Обычный дилер</h2>
    <ul id="regular"><li class="empty">Загрузка…</li></ul>
  </section>

  <section>
    <h2>Мираж (Продвинутый дилер)</h2>
    <ul id="mirage"><li class="empty">Загрузка…</li></ul>
  </section>
</main>

<button id="refresh">Обновить</button>

<footer>
  Источник: bloxvalues.net · обновляется каждые 10 минут<br>
  Сток одинаковый на всех серверах
</footer>

<script>
const RU = {
  Rocket:"Ракета", Spin:"Спин", Blade:"Клинок", Spring:"Пружина", Bomb:"Бомба",
  Smoke:"Дым", Spike:"Шип", Flame:"Пламя", Ice:"Лёд", Sand:"Песок", Dark:"Тьма",
  Eagle:"Орёл", Diamond:"Алмаз", Light:"Свет", Rubber:"Резина", Ghost:"Призрак",
  Magma:"Магма", Quake:"Землетрясение", Buddha:"Будда", Love:"Любовь",
  Creation:"Создание", Spider:"Паук", Sound:"Звук", Phoenix:"Феникс", Portal:"Портал",
  Lightning:"Гром", Pain:"Боль", Blizzard:"Буря", Gravity:"Гравитация",
  Mammoth:"Мамонт", "T-Rex":"Тирекс", Dough:"Тесто", Shadow:"Тень", Venom:"Яд",
  Gas:"Газ", Spirit:"Дух", Tiger:"Тигр", Yeti:"Йети", Magnet:"Магнит",
  Kitsune:"Кицунэ", Control:"Контроль", Dragon:"Дракон"
};

const elRegular = document.getElementById("regular");
const elMirage  = document.getElementById("mirage");
const elUpdated = document.getElementById("updated");
const elTimer   = document.getElementById("timer");
const btn       = document.getElementById("refresh");
let lastData = null;

function fmt(n){
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
}

function renderList(el, items){
  if(!items || !items.length){
    el.innerHTML = '<li class="empty">Сейчас пусто</li>';
    return;
  }
  const sorted = [...items].sort((a,b) => (b.price||0) - (a.price||0));
  el.innerHTML = sorted.map(it => {
    const top = (it.price||0) >= 1000000;
    return '<li class="' + (top ? "top" : "") + '">' +
      '<div><span class="name">' + (RU[it.name] || it.name) +
      '<span class="en">' + it.name + '</span></span></div>' +
      '<div class="price">' + fmt(it.price||0) + '<small>Beli</small></div>' +
      '</li>';
  }).join("");
}

function nextReset(){
  const now = new Date();
  const slots = [0,4,8,12,16,20];
  const base = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  for(const s of slots){
    const d = new Date(base + s*3600*1000);
    if(d > now) return d;
  }
  return new Date(base + 24*3600*1000);
}

function tickTimer(){
  const t = nextReset();
  const left = t - Date.now();
  const m = Math.max(0, Math.floor(left/60000));
  const hh = Math.floor(m/60), mm = m%60;
  const when = t.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
  elTimer.innerHTML = "⏳ До сброса <b>" +
    (hh ? hh + " ч " + mm + " мин" : mm + " мин") +
    "</b> · в " + when;
}

function ago(ts){
  const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if(s < 60) return "только что";
  const m = Math.floor(s/60);
  if(m < 60) return m + " мин назад";
  const h = Math.floor(m/60);
  return h + " ч назад";
}

function showUpdated(data){
  const stale = Date.now()/1000 - data.updated > 1800;
  elUpdated.className = "sub" + (stale ? " warn" : "");
  elUpdated.textContent = (stale ? "⚠ данные могут быть старыми · " : "") +
    "обновлено " + ago(data.updated) + " · " +
    new Date(data.updated*1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
}

async function load(){
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>Загружаю…';
  try{
    const r = await fetch("./data.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    lastData = data;
    renderList(elRegular, data.regular);
    renderList(elMirage, data.mirage);
    showUpdated(data);
    tickTimer();
  }catch(e){
    elUpdated.textContent = "не удалось загрузить данные";
    if(!lastData){
      elRegular.innerHTML = '<li class="empty">Нет связи с данными. Попробуй ещё раз.</li>';
      elMirage.innerHTML  = '<li class="empty">—</li>';
    }
  }finally{
    btn.disabled = false;
    btn.textContent = "Обновить";
  }
}

btn.addEventListener("click", load);
setInterval(tickTimer, 15000);
setInterval(load, 5*60*1000);
document.addEventListener("visibilitychange", () => {
  if(!document.hidden) load();
});

load();

if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(()=>{});
}
</script>
</body>
</html>
