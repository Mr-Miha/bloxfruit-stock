name: Обновить данные

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Скачать сток в data.json
        run: python fetch_data.py

      - name: Закоммитить изменения
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "нечего коммитить"
            exit 0
          fi
          git config user.name "stock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git commit -m "stock $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            sleep 5
          done
          echo "не удалось запушить"
          exit 1
