name: Сток Blox Fruits

on:
  schedule:
    # сбросы стока в 00, 04, 08, 12, 16, 20 UTC — запускаемся через 3 минуты
    - cron: "3 0,4,8,12,16,20 * * *"
    # и ещё раз через 15 минут — на случай, если сайт отдал данные с задержкой
    - cron: "18 0,4,8,12,16,20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Отправить пуш, даже если сток не изменился"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Забрать репозиторий
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Получить сток и отправить пуш
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'bfstock-g7k2m9x4' }}
          NTFY_SERVER: "https://ntfy.sh"
          TZ_OFFSET: "3"
          FORCE: ${{ inputs.force && '1' || '' }}
        run: python stock_push.py

      - name: Сохранить состояние
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "stock-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "stock state $(date -u +%FT%TZ)"
            git push
          else
            echo "изменений нет"
          fi
